<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:description" content="Nieuws, beurs, sportuitslagen, weer en weetjes, zoals vroeger op teletekst. Tik 100.">

<title>txt.info</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=VT323&display=swap">
<style>
/* Eén scherm: teletekstpagina bovenaan (schaalt mee met de breedte), bediening onderaan. Bewust altijd zwart, zoals echte teletekst. */
:root{
 --bg:#000;--panel:#0c0c10;--key:#1d1d24;--fg:#fff;--dim:#8a8a99;
 --t-red:#ff3b30;--t-green:#2f2;--t-yellow:#ff0;--t-blue:#3a6bff;--t-mag:#f3f;--t-cyan:#0ff;
 --f-tt:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;--f-key:"VT323","Courier New",monospace;--lh:1.3;--f-ui:Tahoma,Verdana,"Segoe UI",sans-serif;
 color-scheme:dark;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#scr{flex:1;min-height:0}
#pg{font-family:var(--f-tt);font-weight:500;line-height:var(--lh);white-space:pre;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-ligatures:none;font-feature-settings:"liga" 0;font-size:20px}
.ln{height:calc(var(--lh)*1em)}
.ln:has(.lgw){height:1em;line-height:1}  /* blokletter-logo: rijen tegen elkaar */
.tw{color:var(--fg)}.tr{color:var(--t-red)}.tg{color:var(--t-green)}.ty{color:var(--t-yellow)}.tb{color:var(--t-blue)}.tm{color:var(--t-mag)}.tc{color:var(--t-cyan)}
.bg-b{background:#0018c8}.bg-r{background:#c00}.bg-g{background:#080}.bg-m{background:#909}.bg-c{background:#077}.bg-y{background:#880}
.app{position:relative}
#scr{display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 8px 24px}
#pg{width:max-content;margin:0 auto}
#pg .hdr{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:10px;height:calc(var(--lh)*1em + 10px);box-shadow:0 6px 8px -4px #000}
#pg .lk,#pg a{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
#pg [data-p]{cursor:pointer}
#pg .row{display:inline-block;min-width:100%;border-radius:3px}
#pg .row:active,#pg .lk:active{background:#ffffff22}
#pg.sl{animation:sl .16s ease-out}#pg.sr{animation:sr .16s ease-out}
@keyframes sl{from{transform:translateX(28px);opacity:.2}}@keyframes sr{from{transform:translateX(-28px);opacity:.2}}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border-top:1px solid #222;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;color:var(--dim);padding:6px 0 4px;display:grid;gap:2px;justify-items:center;cursor:pointer;border-radius:10px}
.tabs b{font:700 13px var(--f-tt);color:#666}
.tabs span{font:600 11px var(--f-ui)}
.tabs button.on{color:var(--fg);background:#1c1c24}.tabs button.on b{color:var(--t-yellow)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid #333;border-radius:16px 16px 0 0;
 padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px #000;display:grid;gap:10px;animation:up .18s ease-out;max-height:85%;overflow:auto}
.sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheethead{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.sheethead span{font:700 20px var(--f-tt);color:var(--t-yellow)}
.sheethead button,.secgrid button{height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--key);color:var(--fg);font:600 14px var(--f-ui);cursor:pointer}
.padgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.padgrid button{height:46px;border:0;border-radius:10px;background:var(--key);color:var(--fg);font:700 22px var(--f-tt);cursor:pointer;box-shadow:inset 0 -3px 0 #0006}
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secgrid button{height:auto;padding:8px 6px;display:grid;gap:2px;text-align:left}
.secgrid b{font:700 13px var(--f-tt);color:var(--t-yellow)}
.secgrid span{font:600 13px var(--f-ui)}
.sheet h2{margin:2px 0 -2px;font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.sheet,#pg.sl,#pg.sr{animation:none}}
button:active{filter:brightness(1.4);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--t-yellow);outline-offset:2px}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>

<div class="app">
 <div id="scr" aria-live="polite"><div id="pg"></div></div>
 <nav class="tabs" id="tabs" aria-label="Onderwerpen">
  <button data-go="100"><b>100</b><span>Start</span></button>
  <button data-go="101"><b>101</b><span>België</span></button>
  <button data-go="200"><b>200</b><span>Wereld</span></button>
  <button data-go="500"><b>500</b><span>Sport</span></button>
  <button data-go="600"><b>600</b><span>Weer</span></button>
  <button id="tmore" data-k="more" aria-expanded="false" aria-controls="sheet"><b>···</b><span>Meer</span></button>
 </nav>
 <div class="sheet" id="sheet" hidden>
  <div class="sheethead"><span id="padnum">Ga naar P _ _ _</span><button id="kdel" data-k="del" aria-label="Wissen">⌫</button><button id="kclose" data-k="close">Sluiten ▾</button></div>
  <div class="padgrid">
   <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button>
   <button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button>
  </div>
  <h2>Meer onderwerpen</h2>
  <div class="secgrid">
   <button data-go="300"><b>300</b><span>Financieel</span></button><button data-go="400"><b>400</b><span>Beurs</span></button><button data-go="590"><b>590</b><span>Uitslagen</span></button>
   <button data-go="610"><b>610</b><span>Wetenschap</span></button><button data-go="650"><b>650</b><span>Cultuur</span></button><button data-go="700"><b>700</b><span>Oorlog</span></button>
   <button data-go="800"><b>800</b><span>Klimaat</span></button><button data-go="900"><b>900</b><span>Weetjes</span></button><button data-go="999"><b>999</b><span>Info</span></button>
  </div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const DG=['zo','ma','di','wo','do','vr','za'];
const DAGEN=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAAND=['jan','feb','maa','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const clock=(s=false,d=new Date())=>pad(d.getHours())+':'+pad(d.getMinutes())+(s?':'+pad(d.getSeconds()):'');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ROWS=22;
const DEV=/\/dev\//.test(location.pathname);  // bouwversie op /dev/
if(DEV)document.title='txt.info DEV'; // incl. kopregel

/* ---------- Teletekst-opmaak ---------- */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const C=(cls,s)=>`<span class="${cls}">${esc(s)}</span>`;
const P=(cls,p,label=p)=>`<span class="${cls} lk" data-p="${p}">${esc(label)}</span>`;
const ROW=(p,html)=>`<span class="row" data-p="${p}">${html}</span>`;  // hele regel aanklikbaar
const bar=(cls,s,fg='tw')=>`<span class="${cls} ${fg}">${esc(' '+s.padEnd(39).slice(0,39))}</span>`;
const lead=(label,p,cl='tc')=>ROW(p,C(cl,' '+label+' '+'.'.repeat(Math.max(1,34-label.length))+' ')+C('tw lk',String(p)));
function wrap(s,w=38){const out=[];let l='';String(s||'').split(' ').forEach(x=>{while(x.length>w){out.push(x.slice(0,w));x=x.slice(w)}if((l+' '+x).trim().length>w){out.push(l.trim());l=x}else l+=' '+x});if(l.trim())out.push(l.trim());return out}
const BLOK={T:['███',' █ ',' █ ',' █ ',' █ '],X:['█ █','█ █',' █ ','█ █','█ █'],'.':[' ',' ',' ',' ','█'],I:['███',' █ ',' █ ',' █ ','███'],
 N:['█  █','██ █','█ ██','█  █','█  █'],F:['███','█  ','██ ','█  ','█  '],O:['███','█ █','█ █','█ █','███']};
const MOS=['#ff3b30','#ff0','#2f2','#0ff','#3a6bff','#f3f'];
const bigWord=w=>[0,1,2,3,4].map(r=>'<span class="lgw"></span>  '+w.split('').map((ch,i)=>BLOK[ch][r].split('').map(px=>px==='█'?`<span style="background:${MOS[i%6]}"> </span>`:' ').join('')+' ').join(''));
const num=(v,dec=2)=>v==null?'-':v.toFixed(dec).replace('.',',');
const pct=v=>v==null?'':(v>=0?'+':'')+num(v)+'%';
const up=v=>v==null?'tw':v>=0?'tg':'tr';
function when(iso){if(!iso)return'';const d=new Date(iso),n=new Date();return d.toDateString()===n.toDateString()?clock(false,d):`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${clock(false,d)}`}
const WMO=c=>c===0?'helder':c===1?'vrij zonnig':c===2?'half bewolkt':c===3?'bewolkt':c<=48?'mist':c<=57?'motregen':c<=67?'regen':c<=77?'sneeuw':c<=82?'buien':c<=86?'sneeuwbuien':'onweer';
const WIND=d=>['N','NO','O','ZO','Z','ZW','W','NW'][Math.round(d/45)%8];
const DEF_F={red:[100,'Index'],green:[101,'België'],yellow:[500,'Sport'],blue:[600,'Weer']};

/* ---------- Pagina's opbouwen uit data.json ---------- */
let D=null,LOADERR=false,REG=new Map(),PAGES=[100];
// [sleutel, koppenpagina, eerste artikel, max. artikels, titel, kleur]
const SECT=[['be',101,110,80,'BELGIË','bg-r'],['wereld',200,210,80,'WERELD','bg-b'],['fin',300,310,80,'FINANCIEEL','bg-m'],['sport',500,510,70,'SPORT','bg-g'],
 ['tech',610,611,39,'WETENSCHAP & TECH','bg-c'],['cultuur',650,651,39,'CULTUUR & MEDIA','bg-m'],['oorlog',700,710,80,'OORLOG & BRANDHAARDEN','bg-r'],['klimaat',800,810,80,'KLIMAAT','bg-g']];

function koppen(items,kop,base,title,bg){
 return()=>{const L=[bar(bg,title.length<18?title+'  •  LAATSTE NIEUWS':title)];
  if(kop===500)L.push(ROW(590,C('ty',' ▸ Uitslagen, klassementen, programma')));
  L.push('');if(!items.length)L.push(C('tw',' Geen berichten op dit moment.'));
  items.forEach((it,i)=>{wrap(it.t,34).slice(0,3).forEach((x,k)=>L.push(ROW(base+i,k?C('tw','     '+x):' '+C('ty lk',String(base+i))+C('tw',' '+x))));
   L.push(ROW(base+i,C('tc','     '+when(it.time)+'  '+it.src)))});
  return{L,subs:1}}}
const navRow=(prev,up,next)=>' '+(prev?P('tc',prev,'◀ vorige'):C('tw','        '))+'   '+P('ty',up,'▲ koppen')+'   '+(next?P('tc',next,'volgende ▶'):'');
function artikel(items,i,kop,base,title,bg){const it=items[i];
 return()=>{const L=[bar(bg,`${title}  ${i+1}/${items.length}`),''];wrap(it.t).forEach(x=>L.push(C('ty',' '+x)));
  L.push(C('tc',' '+when(it.time)+'  •  '+it.src));L.push('');wrap(it.s).forEach(x=>L.push(C('tw',' '+x)));L.push('');
  if(it.url)L.push(` <a class="tg" href="${esc(it.url)}" target="_blank" rel="noopener">Lees verder bij ${esc(it.src)} ▸</a>`);
  L.push('');L.push(navRow(i>0?base+i-1:null,kop,i+1<items.length?base+i+1:null));
  return{L,subs:1}}}

function build(){
 REG=new Map();REG.set(100,indexPage);
 SECT.forEach(([key,kop,base,max,title,bg])=>{const items=(D?.news?.[key]||[]).slice(0,max);REG.set(kop,koppen(items,kop,base,title,bg));items.forEach((_,i)=>REG.set(base+i,artikel(items,i,kop,base,title,bg)))});
 // Beurs
 const Q=D?.quotes||[];const det=new Map();let dn=410;Q.forEach(g=>g.items.forEach(it=>{it.page=dn;det.set(dn,{g,it});dn++}));
 REG.set(400,()=>{const L=[bar('bg-y','BEURS  •  AANDELEN','tw'),''];Q.forEach((g,i)=>L.push(lead(cap(g.title),401+i,'ty')));
  const bel=Q.find(g=>g.id==='bel20');if(bel){const s=[...bel.items].filter(x=>x.chg!=null).sort((a,b)=>b.chg-a.chg);L.push('');L.push(C('tc',' BEL 20  stijgers / dalers'));
   for(let k=0;k<3&&k<s.length;k++){const a=s[k],b=s[s.length-1-k];L.push(' '+P('tw',a.page,a.n.slice(0,12).padEnd(12))+C('tg',pct(a.chg).padStart(7))+'   '+P('tw',b.page,b.n.slice(0,12).padEnd(12))+C('tr',pct(b.chg).padStart(7)))}}
  L.push('');L.push(C('tc',' Tik op een naam voor de details.'));return{L,subs:1,F:{red:[100,'Index'],green:[401,'Indexen'],yellow:[402,'BEL 20'],blue:[300,'Financieel']}}});
 Q.forEach((g,gi)=>{const per=10,subs=Math.max(1,Math.ceil(g.items.length/per));const dec=g.id==='fx'?4:2;
  REG.set(401+gi,sub=>{const L=[bar('bg-y',g.title,'tw'),C('tc',' Naam                 Koers    Verschil')];
   g.items.slice((sub-1)*per,sub*per).forEach(it=>{const d=it.p<10&&g.id!=='crypto'?dec:2;L.push(' '+P('tw',it.page,it.n.slice(0,16).padEnd(16))+C('tw',num(it.p,d).padStart(11))+C(up(it.chg),pct(it.chg).padStart(11)))});
   L.push('');const t=g.items.map(x=>x.t).filter(Boolean).sort().pop();L.push(C('ty',' Koersen met vertraging'+(t?'  •  '+when(t):'')));
   return{L,subs,F:{red:[400,'Beurs'],green:subs>1?['sub','Meer ▸']:[401+(gi+1)%Q.length,'Volgende'],yellow:[401+(gi+1)%Q.length,'Volgende'],blue:[100,'Index']}}})});
 det.forEach(({g,it},p)=>REG.set(p,()=>{const L=[bar('bg-y',g.title,'tw'),''];L.push(C('ty',' '+it.n.toUpperCase()));L.push(C('tc',' '+it.sym+(it.cur?'  •  '+it.cur:'')));L.push('');
  const d=it.p<10?4:2;L.push(C('tw',' Laatste koers   ')+C('ty',num(it.p,d).padStart(14)));L.push(C('tw',' Verschil        ')+C(up(it.chg),pct(it.chg).padStart(14)));
  L.push(C('tw',' Dagbereik laag  ')+C('tw',num(it.lo,d).padStart(14)));L.push(C('tw',' Dagbereik hoog  ')+C('tw',num(it.hi,d).padStart(14)));L.push('');
  if(it.lo!=null&&it.hi!=null&&it.hi>it.lo){const w=30,pos=Math.round((it.p-it.lo)/(it.hi-it.lo)*(w-1));L.push(' '+C('tc','L ')+C('tb','═'.repeat(Math.max(0,pos)))+C('ty','█')+C('tb','═'.repeat(Math.max(0,w-1-pos)))+C('tc',' H'))}
  L.push('');L.push(C('tc',' Stand van '+when(it.t)));
  return{L,subs:1,F:{red:[401+Q.indexOf(g),'Lijst'],green:[det.has(p+1)?p+1:410,'Volgende'],yellow:[det.has(p-1)?p-1:p,'Vorige'],blue:[400,'Beurs']}}}));
 // Weer
 const BE=D?.weather?.be||[],EU=D?.weather?.eu||[];
 if(BE.length){
  REG.set(600,()=>{const L=[bar('bg-c','WEER  •  NU IN BELGIË','tw'),warnLine(),C('tc',' Plaats       Temp  Toestand      Wind')];
   BE.forEach(c=>L.push(C('tw',' '+c.n.padEnd(12))+C('ty',(Math.round(c.now)+'°').padStart(5))+C('tw','  '+WMO(c.code).padEnd(13))+C('tc',(WIND(c.wdir)+' '+Math.round(c.wind)).padStart(6))));
   L.push('');L.push(lead('Vandaag & morgen',601,'tw'));L.push(lead('5-daagse per stad',602,'tw'));L.push(lead('Europa',603,'tw'));L.push(lead('Zon op & onder',604,'tw'));L.push(lead('Weerwaarschuwingen',605,'tw'));
   return{L,subs:1,F:{red:[100,'Index'],green:[601,'Vandaag'],yellow:[602,'5-daagse'],blue:[603,'Europa']}}});
  REG.set(601,sub=>{const di=sub-1;const d=new Date(BE[0].days[di].d);const L=[bar('bg-c',(di?'MORGEN':'VANDAAG')+'  •  '+DAGEN[d.getDay()]+' '+d.getDate()+' '+MAAND[d.getMonth()],'tw'),C('tc',' Plaats         Min  Max  Regen  Weer')];
   BE.forEach(c=>{const x=c.days[di];L.push(C('tw',' '+c.n.padEnd(13))+C('tc',(Math.round(x.min)+'°').padStart(5))+C('ty',(Math.round(x.max)+'°').padStart(5))+C('tb',(x.rain+'%').padStart(6))+C('tw','  '+WMO(x.code).slice(0,11)))});
   return{L,subs:2,F:{red:[600,'Nu'],green:['sub',di?'Vandaag':'Morgen'],yellow:[602,'5-daagse'],blue:[100,'Index']}}});
  REG.set(602,sub=>{const per=3,subs=Math.ceil(BE.length/per);const L=[bar('bg-c','WEER  •  5-DAAGSE','tw')];
   BE.slice((sub-1)*per,sub*per).forEach(c=>{L.push('');L.push(C('ty',' '+c.n.toUpperCase()));c.days.forEach(x=>{const d=new Date(x.d);L.push(C('tw','  '+DG[d.getDay()]+' '+pad(d.getDate())+'  ')+C('tc',(Math.round(x.min)+'°').padStart(4))+C('ty',(Math.round(x.max)+'°').padStart(5))+C('tb',(x.rain+'%').padStart(6))+C('tw','  '+WMO(x.code)))})});
   return{L,subs,F:{red:[600,'Nu'],green:['sub','Meer ▸'],yellow:[603,'Europa'],blue:[100,'Index']}}});
  REG.set(603,()=>{const L=[bar('bg-c','WEER  •  EUROPA','tw'),C('tc',' Stad         Nu  Min  Max  Toestand')];
   EU.forEach(c=>{const x=c.days[0];L.push(C('tw',' '+c.n.padEnd(11))+C('ty',(Math.round(c.now)+'°').padStart(4))+C('tc',(Math.round(x.min)+'°').padStart(5))+C('ty',(Math.round(x.max)+'°').padStart(5))+C('tw','  '+WMO(c.code)))});
   return{L,subs:1,F:{red:[600,'België'],green:[604,'Zon'],yellow:[602,'5-daagse'],blue:[100,'Index']}}});
  REG.set(604,()=>{const b=BE.find(c=>c.n==='Brussel')||BE[0];const L=[bar('bg-c','ZON OP & ONDER  •  '+b.n.toUpperCase(),'tw'),'',C('tc',' Dag          Op      Onder    Daglicht')];
   b.days.forEach(x=>{const d=new Date(x.d);const[h1,m1]=x.rise.split(':').map(Number),[h2,m2]=x.set.split(':').map(Number);const len=(h2*60+m2)-(h1*60+m1);L.push(C('tw',' '+(DAGEN[d.getDay()]+' '+d.getDate()).padEnd(13))+C('ty',x.rise.padEnd(8))+C('tm',x.set.padEnd(9))+C('tw',Math.floor(len/60)+'u'+pad(len%60)))});
   return{L,subs:1,F:{red:[600,'Weer'],green:[601,'Vandaag'],yellow:[603,'Europa'],blue:[100,'Index']}}});
 }
 // Ontspanning & info
 REG.set(605,sub=>{const W=D?.warnings||[];const lines=[];
  if(!W.length){lines.push('',C('tg',' Geen weerwaarschuwingen van kracht.'),'',C('tw',' Het KMI waarschuwt bij gevaarlijk weer'),C('tw',' met code geel, oranje of rood.'))}
  W.forEach(w=>{const c=WCOL[w.level];lines.push(`<span style="background:${c[0]};color:${c[1]}">${esc((' CODE '+c[2]+'  '+w.event.replace(/^(Gele|Oranje|Rode) waarschuwing voor /i,'')).toUpperCase().padEnd(39).slice(0,39))}</span>`);
