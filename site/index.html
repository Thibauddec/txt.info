<head>

<style>
/* Eén scherm: teletekstpagina bovenaan (schaalt mee met de breedte), bediening onderaan. Bewust altijd zwart, zoals echte teletekst. */
:root{
 --bg:#000;--panel:#0c0c10;--key:#1d1d24;--fg:#fff;--dim:#8a8a99;
 --t-red:#ff3b30;--t-green:#2f2;--t-yellow:#ff0;--t-blue:#3a6bff;--t-mag:#f3f;--t-cyan:#0ff;
 --f-tt:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;--f-key:"VT323","Courier New",monospace;--lh:1.3;--f-ui:Tahoma,Verdana,"Segoe UI",sans-serif;
 color-scheme:dark;
}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
#scr{flex:1;min-height:0}
#pg{font-family:var(--f-tt);font-weight:500;line-height:var(--lh);white-space:pre;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-ligatures:none;font-feature-settings:"liga" 0;font-size:20px}
.ln{height:calc(var(--lh)*1em)}
.ln:has(.lgw){height:1em;line-height:1}  /* blokletter-logo: rijen tegen elkaar */
.tw{color:var(--fg)}.tr{color:var(--t-red)}.tg{color:var(--t-green)}.ty{color:var(--t-yellow)}.tb{color:var(--t-blue)}.tm{color:var(--t-mag)}.tc{color:var(--t-cyan)}
.bg-b{background:#0018c8}.bg-r{background:#c00}.bg-g{background:#080}.bg-m{background:#909}.bg-c{background:#077}.bg-y{background:#880}
.app{position:relative}
#scr{display:block;overflow:hidden;padding:10px 8px 0;touch-action:pan-x pinch-zoom}
#pg{width:max-content;margin:0 auto}
#pg .hdr{background:var(--bg)}
#pg .lk,#pg a{cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
#pg [data-p]{cursor:pointer}
#pg .row{display:inline-block;min-width:100%;border-radius:3px}
#pg .row.cell{min-width:0}
#pg .row:active,#pg .lk:active{background:#ffffff22}
#pg.sl{animation:sl .16s ease-out}#pg.sr{animation:sr .16s ease-out}
@keyframes sl{from{transform:translateX(28px);opacity:.2}}@keyframes sr{from{transform:translateX(-28px);opacity:.2}}
.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 8px;background:#000;border-top:2px solid #222}
/* Klassieke teletekst-kleurknoppen: vierkant, fel, zwarte terminalletters */
.pager button{height:40px;border:0;border-radius:0;font:700 13px var(--f-tt);letter-spacing:0;text-transform:uppercase;cursor:pointer;padding:0 8px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000;box-shadow:inset -3px -3px 0 #0005,inset 3px 3px 0 #fff4}
.pager #pprev{background:var(--t-red);justify-self:start;max-width:100%}
.pager #pnext{background:var(--t-green);justify-self:end;max-width:100%}
.pager button:active{box-shadow:inset 3px 3px 0 #0005,inset -3px -3px 0 #fff4;transform:none}
.dots{display:flex;gap:4px;align-items:center;justify-content:center;min-width:40px;font:700 16px var(--f-tt);color:#555}
.dots i{font-style:normal;cursor:pointer;line-height:1}
.dots i.on{color:var(--t-yellow)}
.dots b{font:700 14px var(--f-tt);color:var(--t-cyan)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:#000;border-top:2px solid #222;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;color:#777;padding:5px 0 4px;display:grid;gap:1px;justify-items:center;cursor:pointer;border-radius:0}
.tabs b{font:700 13px var(--f-tt);color:#555}
.tabs span{font:500 11px var(--f-tt);text-transform:uppercase;letter-spacing:.02em}
.tabs button.on{color:#000;background:var(--t-cyan)}.tabs button.on b{color:#000}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid #333;border-radius:0;
 padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px #000;display:grid;gap:10px;animation:up .18s ease-out;max-height:85%;overflow:auto}
.sheet[hidden]{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheethead{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.sheethead span{font:700 20px var(--f-tt);color:var(--t-yellow)}
.sheethead button,.secgrid button{height:40px;padding:0 14px;border:0;border-radius:0;background:var(--key);color:var(--fg);font:700 14px var(--f-tt);cursor:pointer}
.padgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.padgrid button{height:46px;border:0;border-radius:0;background:var(--key);color:var(--fg);font:700 22px var(--f-tt);cursor:pointer;box-shadow:inset 0 -3px 0 #0006}
.secgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secgrid button{height:auto;padding:8px 6px;display:grid;gap:2px;text-align:left}
.secgrid b{font:700 13px var(--f-tt);color:var(--t-yellow)}
.secgrid span{font:500 13px var(--f-tt)}
.sheet h2{margin:2px 0 -2px;font:700 12px var(--f-tt);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.sheet,#pg.sl,#pg.sr{animation:none}}
button:active{filter:brightness(1.4);transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--t-yellow);outline-offset:2px}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>

<div class="app">
 <div id="scr" aria-live="polite"><div id="pg"></div></div>
 <div class="pager" id="pager">
  <button id="pprev" data-k="prev">◀ terug</button>
  <div class="dots" id="dots" aria-label="Schermen"></div>
  <button id="pnext" data-k="next">verder ▶</button>
 </div>
 <nav class="tabs" id="tabs" aria-label="Onderwerpen">
  <button data-go="100"><b>100</b><span>Start</span></button>
  <button data-go="101"><b>101</b><span>Vandaag</span></button>
  <button data-go="200"><b>200</b><span>Wereld</span></button>
  <button data-go="500"><b>500</b><span>Sport</span></button>
  <button data-go="600"><b>600</b><span>Weer</span></button>
  <button id="tmore" data-k="more" aria-expanded="false" aria-controls="sheet"><b>···</b><span>Meer</span></button>
 </nav>
 <div class="sheet" id="sheet" hidden>
  <div class="sheethead"><span id="padnum">Ga naar P _ _ _</span><button id="kdel" data-k="del" aria-label="Wissen">⌫</button><button id="kclose" data-k="close">Sluiten ▾</button></div>
  <div class="padgrid">
   <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button>
   <button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="0">0</button>
  </div>
  <h2>Meer onderwerpen</h2>
  <div class="secgrid">
   <button data-go="250"><b>250</b><span>VS</span></button><button data-go="275"><b>275</b><span>China &amp; Azië</span></button><button data-go="300"><b>300</b><span>Financieel</span></button>
   <button data-go="400"><b>400</b><span>Beurs</span></button><button data-go="480"><b>480</b><span>Macro</span></button><button data-go="590"><b>590</b><span>Uitslagen</span></button>
   <button data-go="610"><b>610</b><span>Wetenschap</span></button><button data-go="630"><b>630</b><span>AI</span></button><button data-go="650"><b>650</b><span>Cultuur</span></button>
   <button data-go="700"><b>700</b><span>Oorlog</span></button><button data-go="800"><b>800</b><span>Klimaat</span></button><button data-go="900"><b>900</b><span>Weetjes</span></button>
   <button data-go="495"><b>495</b><span>Cijfers</span></button><button data-go="870"><b>870</b><span>Rampen</span></button><button data-go="871"><b>871</b><span>Aardbevingen</span></button>
  </div>
 </div>
</div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const DG=['zo','ma','di','wo','do','vr','za'];
const DAGEN=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MAAND=['jan','feb','maa','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const clock=(s=false,d=new Date())=>pad(d.getHours())+':'+pad(d.getMinutes())+(s?':'+pad(d.getSeconds()):'');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ROWS=22;
const DEV=/\/dev\//.test(location.pathname);  // bouwversie op /dev/
if(DEV)document.title='txt.info DEV'; // incl. kopregel

/* ---------- Teletekst-opmaak ---------- */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const C=(cls,s)=>`<span class="${cls}">${esc(s)}</span>`;
const P=(cls,p,label=p)=>`<span class="${cls} lk" data-p="${p}">${esc(label)}</span>`;
const CELL=(p,html)=>`<span class="row cell" data-p="${p}">${html}</span>`;  // aanklikbaar vak in een rij met twee kolommen
const ROW=(p,html)=>`<span class="row" data-p="${p}">${html}</span>`;  // hele regel aanklikbaar
const bar=(cls,s,fg='tw')=>`<span class="${cls} ${fg}">${esc(' '+s.padEnd(39).slice(0,39))}</span>`;
const lead=(label,p,cl='tc')=>ROW(p,C(cl,' '+label+' '+'.'.repeat(Math.max(1,34-label.length))+' ')+C('tw lk',String(p)));
function wrap(s,w=38){const out=[];let l='';String(s||'').split(' ').forEach(x=>{while(x.length>w){out.push(x.slice(0,w));x=x.slice(w)}if((l+' '+x).trim().length>w){out.push(l.trim());l=x}else l+=' '+x});if(l.trim())out.push(l.trim());return out}
const BLOK={T:['███',' █ ',' █ ',' █ ',' █ '],X:['█ █','█ █',' █ ','█ █','█ █'],'.':[' ',' ',' ',' ','█'],I:['███',' █ ',' █ ',' █ ','███'],
 N:['█  █','██ █','█ ██','█  █','█  █'],F:['███','█  ','██ ','█  ','█  '],O:['███','█ █','█ █','█ █','███']};
const MOS=['#ff3b30','#ff0','#2f2','#0ff','#3a6bff','#f3f'];
const bigWord=w=>[0,1,2,3,4].map(r=>'<span class="lgw"></span>  '+w.split('').map((ch,i)=>BLOK[ch][r].split('').map(px=>px==='█'?`<span style="background:${MOS[i%6]}"> </span>`:' ').join('')+' ').join(''));
const num=(v,dec=2)=>v==null?'-':v.toFixed(dec).replace('.',',');
const pct=v=>v==null?'':(v>=0?'+':'')+num(v)+'%';
const up=v=>v==null?'tw':v>=0?'tg':'tr';
function when(iso){if(!iso)return'';const d=new Date(iso),n=new Date();return d.toDateString()===n.toDateString()?clock(false,d):`${pad(d.getDate())}/${pad(d.getMonth()+1)} ${clock(false,d)}`}
const WMO=c=>c===0?'helder':c===1?'vrij zonnig':c===2?'half bewolkt':c===3?'bewolkt':c<=48?'mist':c<=57?'motregen':c<=67?'regen':c<=77?'sneeuw':c<=82?'buien':c<=86?'sneeuwbuien':'onweer';
const WIND=d=>['N','NO','O','ZO','Z','ZW','W','NW'][Math.round(d/45)%8];
const DEF_F={red:[100,'Index'],green:[101,'België'],yellow:[500,'Sport'],blue:[600,'Weer']};

/* ---------- Pagina's opbouwen uit data.json ---------- */
let D=null,LOADERR=false,REG=new Map(),PAGES=[100];
// [sleutel, koppenpagina, eerste artikel, max. artikels, titel, kleur]
const SECT=[['be',102,110,80,'BELGIË','bg-r'],['wereld',200,210,40,'WERELD','bg-b'],['vs',250,251,24,'VERENIGDE STATEN','bg-b'],['china',275,276,24,'CHINA & AZIË','bg-b'],
 ['fin',300,310,80,'FINANCIEEL','bg-m'],['macro',480,481,14,'MACRO-ECONOMIE','bg-y'],['sport',500,510,70,'SPORT','bg-g'],
 ['tech',610,611,19,'WETENSCHAP & TECH','bg-c'],['ai',630,631,19,'ARTIFICIËLE INTELLIGENTIE','bg-c'],['cultuur',650,651,39,'CULTUUR & MEDIA','bg-m'],
 ['oorlog',700,710,80,'OORLOG & BRANDHAARDEN','bg-r'],['klimaat',800,810,60,'KLIMAAT','bg-g']];

function koppen(items,kop,base,title,bg){
 return()=>{const L=[bar(bg,title.length<18?title+'  •  LAATSTE NIEUWS':title)];
  if(kop===500)L.push(ROW(590,C('ty',' ▸ Uitslagen, klassementen, programma')));
  if(kop===800){L.push(ROW(870,C('ty',' ▸ Natuurrampen nu ')+C('tw lk','870')));L.push(ROW(871,C('ty',' ▸ Aardbevingen ')+C('tw lk','871')+C('ty','  ▸ NASA ')+C('tw lk','872')))}
  if(kop===480)L.push(ROW(495,C('ty',' ▸ Cijfers: ECB-rente, inflatie, werkloosheid ')+C('tw lk','495')));
  L.push('');if(!items.length)L.push(C('tw',' Geen berichten op dit moment.'));
  items.forEach((it,i)=>{wrap(it.t,34).slice(0,3).forEach((x,k)=>L.push(ROW(base+i,k?C('tw','     '+x):' '+C('ty lk',String(base+i))+C('tw',' '+x))));
   L.push(ROW(base+i,C('tc','     '+when(it.time)+'  '+it.src)+(it.also?C('tg','  +'+it.also.length+(it.also.length>1?' bronnen':' bron')):'')))});
  return{L,subs:1}}}
const navRow=(prev,up,next)=>' '+(prev?P('tc',prev,'◀ vorige'):C('tw','        '))+'   '+P('ty',up,'▲ koppen')+'   '+(next?P('tc',next,'volgende ▶'):'');
function artikel(items,i,kop,base,title,bg){const it=items[i];
 return()=>{const L=[bar(bg,`${title}  ${i+1}/${items.length}`),''];wrap(it.t).forEach(x=>L.push(C('ty',' '+x)));
  L.push(C('tc',' '+when(it.time)+'  •  '+it.src));if(it.also)wrap('Ook bij: '+it.also.join(', '),37).forEach(x=>L.push(C('tg',' '+x)));L.push('');
  wrap(it.s).forEach(x=>L.push(C('tw',' '+x)));if(!it.s)L.push(C('tc',' Enkel de kop is beschikbaar. Lees het volledige bericht via de link.'));L.push('');
  if(it.url)L.push(` <a class="tg" href="${esc(it.url)}" target="_blank" rel="noopener">Lees verder bij ${esc(it.src)} ▸</a>`);
  L.push('');L.push(navRow(i>0?base+i-1:null,kop,i+1<items.length?base+i+1:null));
  return{L,subs:1}}}

function build(){
 REG=new Map();REG.set(100,indexPage);
 SECT.forEach(([key,kop,base,max,title,bg])=>{const items=(D?.news?.[key]||[]).slice(0,max);REG.set(kop,koppen(items,kop,base,title,bg));items.forEach((_,i)=>REG.set(base+i,artikel(items,i,kop,base,title,bg)))});
 // Beurs: marktoverzicht, lijsten met minigrafiek, detailpagina met grafiek, macro-economie op 480
 const Q=D?.quotes||[];const det=new Map();let dn=410;Q.forEach(g=>g.items.forEach(it=>{it.page=dn;it.grp=g;det.set(dn,{g,it});dn++}));
 const dec=(it,g)=>g.id==='fx'&&it.p<10?4:it.p<1?4:2;
 const qrow=(it,g,nw=13)=>ROW(it.page,C('tw',' '+it.n.slice(0,nw).padEnd(nw))+C('ty',num(it.p,dec(it,g)).padStart(10))+C(up(it.chg),pct(it.chg).padStart(8))+' '+C(up(it.month),spark(it.spark,7)));
 const grp=id=>Q.find(g=>g.id===id);
 REG.set(400,()=>{const L=[bar('bg-y','BEURS  •  MARKTOVERZICHT','tw')];
  const idx=grp('idx'),all=Q.filter(g=>['bel20','eu','us'].includes(g.id)).flatMap(g=>g.items.map(it=>({...it,g}))).filter(x=>x.chg!=null);
  const bru=grp('bel20')?.items?.[0];L.push(C('tc',' Brussel '+(bru?.open?'open':'gesloten')+'  •  New York '+(grp('us')?.items?.[0]?.open?'open':'gesloten')+'  •  '+clock()));
  L.push(C('tc',' Index          Stand     Dag   1 maand'));
  (idx?.items||[]).slice(0,8).forEach(it=>L.push(qrow(it,idx)));
  L.push('');L.push(C('ty',' STIJGERS')+C('tw','                ')+C('ty','DALERS'));
  const s=[...all].sort((a,b)=>b.chg-a.chg);for(let k=0;k<4&&k<s.length;k++){const x=s[k],y=s[s.length-1-k];
   L.push(' '+P('tw',x.page,x.n.slice(0,11).padEnd(11))+C('tg',pct(x.chg).padStart(7))+'  '+P('tw',y.page,y.n.slice(0,11).padEnd(11))+C('tr',pct(y.chg).padStart(7)))}
  const r=grp('rente'),fx=grp('fx');const pick=(g,n)=>g?.items?.find(i=>i.n===n);const t10=pick(r,'VS 10 jaar'),vix=pick(r,'VIX angstindex'),eur=pick(fx,'EUR/USD'),brent=pick(fx,'Brent $/vat'),gold=pick(fx,'Goud $/oz');
  L.push('');L.push(C('tw',' VS 10j ')+C('ty',(t10?num(t10.p)+'%':'-').padEnd(7))+C('tw',' VIX ')+C('ty',(vix?num(vix.p,1):'-').padEnd(6))+C('tw',' EUR/USD ')+C('ty',eur?num(eur.p,4):'-'));
  L.push(C('tw',' Brent ')+C('ty',(brent?'$'+num(brent.p,1):'-').padEnd(8))+C('tw',' Goud ')+C('ty',gold?'$'+num(gold.p,0):'-'));
  const dfr=D?.economy?.rates?.find(r=>r.n==='Depositorente'),hicp=D?.economy?.inflation?.find(r=>r.n==='Eurozone');
  if(dfr||hicp)L.push(ROW(495,C('tw',' ECB ')+C('ty',(dfr?num(dfr.v)+'%':'-').padEnd(7))+C('tw',' Inflatie EZ ')+C('ty',hicp?num(hicp.v,1)+'%':'-')+C('tc','  ▸ ')+C('tw lk','495')));
  const M=(D?.news?.macro||[]).slice(0,3);if(M.length){L.push('');L.push(ROW(480,C('ty',' MACRO-ECONOMIE ')+C('tw lk','480')));M.forEach((it,i)=>wrap(it.t,37).slice(0,2).forEach((x,k)=>L.push(ROW(481+i,C(k?'tw':'tw',' '+(k?'  ':'• ')+x)))))}
  L.push('');Q.forEach((g,i)=>L.push(lead(QLABEL[g.id]||cap(g.title),401+i,'ty')));
  L.push('');L.push(C('tc',' Koersen met vertraging. Tik voor details.'));
  return{L,subs:1}});
 Q.forEach((g,gi)=>REG.set(401+gi,()=>{const L=[bar('bg-y',g.title,'tw'),C('tc',' Naam              Koers     Dag 1 maand')];
  g.items.forEach(it=>L.push(qrow(it,g)));
  const t=g.items.map(x=>x.t).filter(Boolean).sort().pop();L.push('');L.push(C('tc',' Koersen met vertraging'+(t?'  •  '+when(t):'')));
  return{L,subs:1}}));
 det.forEach(({g,it},p)=>REG.set(p,()=>{const d=dec(it,g);const L=[bar('bg-y',g.title,'tw'),''];
  L.push(C('ty',' '+String(it.name||it.n).slice(0,38)));L.push(C('tc',' '+it.sym+(it.cur?'  •  '+it.cur:'')+'  •  '+(it.open?'markt open':'markt gesloten')));L.push('');
  L.push(C('tw',' Koers        ')+C('ty',num(it.p,d).padStart(12))+'  '+C(up(it.chg),pct(it.chg)));
  L.push(C('tw',' 1 maand      ')+C(up(it.month),pct(it.month).padStart(12)));

const QLABEL={idx:'Beursindexen',bel20:'BEL 20-aandelen',eu:'Europese aandelen',us:'Amerikaanse aandelen',fx:'Valuta & grondstoffen',crypto:'Crypto',rente:'Rente & volatiliteit'};
const BLOCKS='▁▂▃▄▅▆▇█';
function resample(v,n){if(!v||!v.length)return[];return Array.from({length:n},(_,i)=>v[Math.min(v.length-1,Math.round(i*(v.length-1)/Math.max(1,n-1)))])}
function spark(v,n){const r=resample(v,n);if(r.length<2)return' '.repeat(n);const lo=Math.min(...r),hi=Math.max(...r);return r.map(x=>BLOCKS[hi>lo?Math.round((x-lo)/(hi-lo)*7):3]).join('')}
function chart(v,w,h){const r=resample(v,w);if(r.length<2)return[];const lo=Math.min(...r),hi=Math.max(...r);const lv=r.map(x=>hi>lo?(x-lo)/(hi-lo)*(h*8-1)+1:h*4);
 const rows=[];for(let y=h-1;y>=0;y--){rows.push(lv.map(l=>{const f=l-y*8;return f>=8?'█':f<=0?' ':BLOCKS[Math.max(0,Math.ceil(f)-1)]}).join(''))}return rows}
function rangeBar(lo,hi,p,d){const w=14,pos=Math.max(0,Math.min(w-1,Math.round((p-lo)/(hi-lo)*(w-1))));
 return C('tw',num(lo,d).padStart(9)+' ')+C('tb','─'.repeat(pos))+C('ty','●')+C('tb','─'.repeat(w-1-pos))+C('tw',' '+num(hi,d))}
const WCOL={yellow:['#cc0','#000','GEEL'],orange:['#e70','#000','ORANJE'],red:['#d00','#fff','ROOD']};
function period(a,b){const f=x=>{const d=new Date(x);return DG[d.getDay()]+' '+clock(false,d)};return a&&b?f(a)+'  tot  '+f(b):''}
function warnLine(){const W=D?.warnings||[];if(!W.length)return C('tg',' Geen weerwaarschuwingen');const w=W[0],c=WCOL[w.level];
 return `<span style="background:${c[0]};color:${c[1]}" data-p="605">${esc((' ! CODE '+c[2]+': '+w.event.replace(/^(Gele|Oranje|Rode) waarschuwing voor /i,'')+(W.length>1?' (+'+(W.length-1)+')':'')).padEnd(34).slice(0,34))}</span> `+P('tw',605)}
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n){let c=a.slice(i,i+n);while(c.length&&!c[0])c=c.slice(1);o.push(c)}return o.length?o:[[]]};

function indexPage(){const L=[...bigWord('TXT.INFO'),C('tg',' C:\\TXT.INFO> ')+'<span class="tg blink">_</span>',(DEV?bar('bg-m','BOUWVERSIE  •  INDEX','tw'):bar('bg-b','TELETEKST  •  INDEX','ty'))];
 const IX=[['Vandaag',101],['België',102],['Wereld',200],['VS',250],['China & Azië',275],['Financieel',300],['Beurs',400],['Macro',480],['Sport',500],['Uitslagen',590],['Weer',600],
  ['Wetenschap',610],['AI',630],['Cultuur',650],['Oorlog',700],['Klimaat',800],['Weetjes',900]];
 for(let k=0;k<IX.length;k+=2)L.push(IX.slice(k,k+2).map(([l,n])=>CELL(n,C('tc',' '+l.padEnd(13).slice(0,13)+' ')+C('tw lk',String(n)))).join('  '));
 L.push('');L.push(D?C('tg',' Bijgewerkt: '+when(D.updated)):LOADERR?C('tr',' Geen verbinding met de nieuwsdienst.'):C('ty',' Gegevens laden...'));
 L.push(D?.warnings?.length?warnLine():C('tc',' Tik een onderwerp of veeg opzij'));return{L,subs:1,F:DEF_F}}
function horoscoop(sub){const day=Math.floor(Date.now()/864e5);const L=[bar('bg-m','HOROSCOOP  (met een knipoog)','tw'),''];
 const tekens=['Ram','Stier','Tweelingen','Kreeft','Leeuw','Maagd','Weegschaal','Schorpioen','Boogschutter','Steenbok','Waterman','Vissen'];
 const zinnen=['Een onverwacht telefoontje brengt goed nieuws.','Neem vandaag de tijd voor jezelf.','Op het werk word je gewaardeerd.','Een oude vriend duikt weer op.','Let op je uitgaven deze week.','De liefde lacht je toe.','Een kleine reis doet wonderen.','Luister naar je gevoel.','Durf eens nee te zeggen.','Een goed gesprek lucht op.'];
 const r=rng(day+700);const z=tekens.map(()=>zinnen[r()*zinnen.length|0]);
 tekens.slice((sub-1)*4,sub*4).forEach((tk,i)=>{L.push(C('ty',' '+tk.toUpperCase()));wrap(z[(sub-1)*4+i]).forEach(x=>L.push(C('tw',' '+x)));L.push('')});
 return{L,subs:3,F:{red:[900,'Weetjes'],green:['sub','Meer ▸'],yellow:[990,'Kalender'],blue:[100,'Index']}}}
function kalender(){const d=new Date();const y=d.getFullYear();const start=new Date(y,0,1);const doy=Math.floor((d-start)/864e5)+1;
 const t=new Date(Date.UTC(y,d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const wk=Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7);
 const until=(m,dd)=>{let x=new Date(y,m,dd);if(x<new Date(y,d.getMonth(),d.getDate()))x=new Date(y+1,m,dd);return Math.round((x-new Date(y,d.getMonth(),d.getDate()))/864e5)};
 const L=[bar('bg-b','KALENDER','ty'),'',C('ty',' '+DAGEN[d.getDay()]+' '+d.getDate()+' '+MAAND[d.getMonth()]+' '+y),'',
  C('tw',' Weeknummer            ')+C('ty',String(wk)),C('tw',' Dag van het jaar      ')+C('ty',String(doy)),'',
  C('tw',' Nog te gaan tot ...'),C('tc','   Sinterklaas         ')+C('ty',until(11,6)+' dagen'),C('tc','   Kerstmis            ')+C('ty',until(11,25)+' dagen'),C('tc','   Nieuwjaar           ')+C('ty',until(0,1)+' dagen'),C('tc','   Nationale feestdag  ')+C('ty',until(6,21)+' dagen')];
 return{L,subs:1}}
function info(){const L=[bar('bg-b','OVER DEZE TELETEKST','ty'),''];
 wrap('Een eerbetoon aan de teletekst van vroeger, gevuld met actuele gegevens. Niet verbonden aan een omroep of kabelmaatschappij.').forEach(x=>L.push(C('tw',' '+x)));L.push('');
 const srcs=D?[...new Set(Object.values(D.news).flat().map(i=>i.src))].sort((a,b)=>a.localeCompare(b)):[];
 L.push(C('tc',' Nieuws uit '+srcs.length+' bronnen'));wrap(srcs.join(', '),37).slice(0,8).forEach(x=>L.push(C('tw','  '+x)));
 L.push(C('tc',' Koersen: ')+C('tw','Yahoo Finance (vertraagd)'));L.push(C('tc',' Sport: ')+C('tw','ESPN'));L.push(C('tc',' Data: ')+C('tw','ECB, Eurostat, USGS, GDACS, NASA'));L.push(C('tc',' Weer: ')+C('tw','Open-Meteo'));
 L.push('');if(D)L.push(C('tg',' Laatst bijgewerkt: '+when(D.updated)));
 return{L,subs:1,F:DEF_F}}

/* ---------- Status & weergave ---------- */
const scr=$('#scr'),pgEl=$('#pg');
const startPage=+location.hash.slice(1)||+store.get('elenet-ttx-page')||100;
const TT={page:startPage,buf:'',searchUntil:0};
// Alle subpagina's onder elkaar: geen automatisch doorbladeren meer; dezelfde titelbalk wordt niet herhaald
function pageLines(fn){const first=fn(1);const out=[...first.L];
 for(let k=2;k<=(first.subs||1);k++){const r=fn(k).L;let j=0;if(r[0]===first.L[0]){j=1;while(r[j]==='')j++}out.push('',...r.slice(j))}
 return out}
function header(){const now=Date.now(),searching=now<TT.searchUntil,d=new Date();
 const pnum=TT.buf?(TT.buf+'---').slice(0,3):String(TT.page);
 const roll=searching?String(100+Math.floor(now/37)%800):String(TT.page);
 return C('tw','P'+pnum.padEnd(4))+C(searching?'tg':'tw',roll.padEnd(4))+(DEV?C('tm','txt.dev  '):C('ty','txt.info '))+C('tw',`${pad(d.getDate())} ${MAAND[d.getMonth()]} `)+C('ty',clock(true))}
// Verdeel de regels in schermen die precies passen. Een nieuwsbericht (zelfde data-p) wordt nooit gesplitst;
// vervolg-schermen krijgen opnieuw de titelbalk bovenaan, zodat je altijd weet waar je bent.
function rowsFit(){const fs=parseFloat(pgEl.style.fontSize)||15,lh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||1.3;
 return Math.max(8,Math.floor((scr.clientHeight-10)/(fs*lh))-1)}  // -1 voor de kopregel
function toScreens(lines,R){
 const isBar=l=>/^<span class="bg-/.test(l||'');
 const key=l=>{const m=/^<span class="row" data-p="(\d+)"/.exec(l||'');return m?m[1]:null};
 // Blokken: een nieuwsbericht (zelfde data-p) blijft samen; een titelbalk plakt aan de regels die erop volgen
 const blocks=[];
 lines.forEach(l=>{const k=key(l),last=blocks[blocks.length-1];
  if(last&&((k&&last.k===k)||(last.glue&&l!=='')))  {last.l.push(l);if(last.glue)last.glue--;if(k)last.k=k}
  else blocks.push({k,l:[l],glue:isBar(l)?2:0,bar:isBar(l)?l:null})});
 const out=[];let cur=[],sect=null;
 const fresh=()=>{out.push(cur);cur=sect?[sect]:[]};
 blocks.forEach(b=>{
  if(b.bar)sect=b.bar;                                   // titel van de sectie waarin we nu zitten
  if(b.l.length===1&&!b.l[0]&&cur.length<=(sect&&cur[0]===sect?1:0))return;  // geen lege regel bovenaan
  let bl=b.l;
  if(b.bar&&cur.length&&cur[cur.length-1]!==undefined&&bl.length>R-cur.length){fresh();if(cur[0]===b.bar)cur=[]}
  while(bl.length){const room=R-cur.length;
   if(bl.length<=room||cur.length<=(cur[0]===sect?1:0)){const take=bl.slice(0,Math.max(1,room));cur.push(...take);bl=bl.slice(take.length)}
   if(bl.length){fresh();while(bl.length&&bl[0]==='')bl=bl.slice(1)}}});
 if(cur.some(l=>l&&l!==sect)||!out.length)out.push(cur);
 return out.filter(sc=>sc.some(l=>l&&!isBar(l))||out.length===1).map(sc=>{while(sc.length>1&&!sc[sc.length-1])sc.pop();return sc})}
const NAMES={100:'Start',101:'Vandaag',102:'België',200:'Wereld',250:'VS',275:'China',300:'Financieel',400:'Beurs',480:'Macro',500:'Sport',590:'Uitslagen',600:'Weer',610:'Wetenschap',630:'AI',650:'Cultuur',700:'Oorlog',800:'Klimaat',900:'Weetjes'};
let SCREENS=[[]];
function draw(sc=0,dir=0){
 let lines;
 if(Date.now()<TT.searchUntil)lines=[];
 else{const fn=REG.get(TT.page);
  lines=fn?pageLines(fn):['','',C('tr',' Pagina '+TT.page+' bestaat niet.'),'',C(D||LOADERR?'tw':'ty',D||LOADERR?' Ga terug naar de start met 100.':' Gegevens laden...')]}
 // Past een pagina bijna (tot 35% te lang)? Dan iets kleinere letters i.p.v. een bijna leeg tweede scherm
 pgEl.style.fontSize=BASEFS+'px';let R=rowsFit();
 if(lines.length>R&&lines.length<=R*1.35){const lh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||1.3;
  const fs=Math.floor((scr.clientHeight-10)/((lines.length+1)*lh));if(fs>=11){pgEl.style.fontSize=fs+'px';R=lines.length}}
 SCREENS=toScreens(lines,R);
 TT.sc=Math.max(0,Math.min(sc,SCREENS.length-1));
 show(dir);
 const p=TT.page,tab=p===100?100:p===101?101:p<200?0:p<300?200:p>=500&&p<600?500:p>=600&&p<610?600:0;
 document.querySelectorAll('#tabs [data-go]').forEach(b=>b.classList.toggle('on',+b.dataset.go===tab));
 $('#tmore').classList.toggle('on',!tab);
}
function show(dir=0){
 const n=SCREENS.length,sc=TT.sc;
 pgEl.innerHTML=`<div class="ln hdr">${header()+(n>1?C('tc',' '+(sc+1)+'/'+n):'')}</div>`+SCREENS[sc].map(l=>`<div class="ln">${l||' '}</div>`).join('');
 pgEl.classList.remove('sl','sr');if(dir){void pgEl.offsetWidth;pgEl.classList.add(dir>0?'sl':'sr')}
 $('#dots').innerHTML=n<=1?'':n<=8?SCREENS.map((_,i)=>`<i data-sc="${i}" class="${i===sc?'on':''}">${i===sc?'■':'□'}</i>`).join(''):`<b>${sc+1}/${n}</b>`;
 const nx=sc<n-1?null:target(1),pv=sc>0?null:target(-1);
 const bn=$('#pnext'),bp=$('#pprev');
 bn.textContent=nx?nx.label+' ▶':'verder ▶';bn.classList.toggle('far',!!nx);
 bp.textContent=pv?'◀ '+pv.label:'◀ terug';bp.classList.toggle('far',!!pv);
 if(history.state&&history.state.p===TT.page)history.replaceState({p:TT.page,sc},'','#'+TT.page);
}
function tick(){const h=pgEl.firstElementChild;if(h)h.innerHTML=header()+(SCREENS.length>1?C('tc',' '+(TT.sc+1)+'/'+SCREENS.length):'')}
// Navigeren met geschiedenis: de terugknop van de gsm brengt je naar de vorige pagina, op dezelfde plek
function go(p,o={}){
 if(o.push!==false&&p!==TT.page){history.replaceState({p:TT.page,sc:TT.sc||0},'','#'+TT.page);history.pushState({p,sc:0},'','#'+p)}
 TT.page=p;TT.buf='';store.set('elenet-ttx-page',p);
 TT.searchUntil=o.search?Date.now()+300:0;
 draw(o.sc||0,o.dir||0);
 if(o.search)setTimeout(()=>draw(0,0),320);
}
addEventListener('popstate',e=>{const p=e.state?.p??(+location.hash.slice(1)||100);sheet(false);go(p,{push:false,sc:e.state?.sc||0,dir:-1})});
// Vegen: binnen een onderwerp naar het volgende/vorige artikel, anders naar het volgende onderwerp
const SEQ=[100,101,102,200,250,275,300,400,480,500,590,600,610,630,650,700,800,900];
const artOf=p=>SECT.find(([k,kop,base,max])=>p>=base&&p<base+max);
// Waar brengt "verder" of "terug" je na het laatste/eerste scherm?
function target(d){const p=TT.page,a=artOf(p);
 if(a){const[k,kop,base,max]=a;const n=p+d,cnt=Math.min(max,(D?.news?.[k]||[]).length);
  return n>=base&&n<base+cnt?{p:n,label:d>0?'volgend artikel':'vorig artikel'}:{p:kop,label:'koppen'}}
 if(p>=410&&p<480)return REG.has(p+d)?{p:p+d,label:d>0?'volgend aandeel':'vorig aandeel'}:{p:400,label:'Beurs'};
 if(!SEQ.includes(p)){const sib=PAGES.filter(x=>Math.floor(x/100)===Math.floor(p/100)&&!SEQ.includes(x)&&!artOf(x)&&!(x>=410&&x<480));const i=sib.indexOf(p);
  if(i>=0&&sib[i+d])return{p:sib[i+d],label:d>0?'volgende pagina':'vorige pagina'}}
 let i=0;SEQ.forEach((x,k)=>{if(x<=p)i=k});const t=SEQ[(i+d+SEQ.length)%SEQ.length];return{p:t,label:NAMES[t]}}
function swipe(d){const n=SCREENS.length;
 if(d>0&&TT.sc<n-1){TT.sc++;return show(1)}
 if(d<0&&TT.sc>0){TT.sc--;return show(-1)}
 const t=target(d);go(t.p,{dir:d})}
// Blad "Meer": cijferpaneel + overige onderwerpen
function padShow(){$('#padnum').textContent='Ga naar P '+(TT.buf+'___').slice(0,3).split('').join(' ')}
function sheet(on){$('#sheet').hidden=!on;$('#tmore').setAttribute('aria-expanded',on);if(on)padShow();else TT.buf=''}
function key(k){
 try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
 if(/^\d$/.test(k)){if($('#sheet').hidden)sheet(true);if(!TT.buf&&k==='0')return;TT.buf+=k;padShow();tick();
  if(TT.buf.length===3){const p=+TT.buf;sheet(false);if(p>=100&&p<=999)go(p,{search:true});else tick()}return}
 switch(k){
  case 'del':TT.buf=TT.buf.slice(0,-1);padShow();tick();break;
  case 'more':sheet($('#sheet').hidden);break;
  case 'close':sheet(false);tick();break;
  case 'prev':swipe(-1);break;case 'next':swipe(1);break;
 }
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){sheet(false);return go(+g.dataset.go)}
 const b=e.target.closest('[data-k]');if(b)return key(b.dataset.k);
 const dt=e.target.closest('#dots [data-sc]');if(dt){const n=+dt.dataset.sc;const dir=n>TT.sc?1:-1;TT.sc=n;return show(dir)}
 const l=e.target.closest('#pg [data-p]');if(l){sheet(false);return go(+l.dataset.p)}
 if(!$('#sheet').hidden&&!e.target.closest('#sheet'))sheet(false);
});
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const m={ArrowLeft:'prev',ArrowRight:'next',ArrowUp:'prev',ArrowDown:'next',PageUp:'prev',PageDown:'next',' ':'next',Backspace:'del',Escape:'close'};const k=/^\d$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();key(k)}});
let tx=null,ty=null;
scr.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
scr.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)swipe(dx<0?1:-1);else if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.5)swipe(dy<0?1:-1)},{passive:true});
// muiswiel op de computer: één scherm per draai
let wheelT=0;scr.addEventListener('wheel',e=>{e.preventDefault();const t=Date.now();if(t-wheelT<450||Math.abs(e.deltaY)<20)return;wheelT=t;swipe(e.deltaY>0?1:-1)},{passive:false});

/* Lettergrootte zo kiezen dat 40 kolommen x 22 rijen precies passen */
function fit(){const pg=pgEl;pg.style.fontSize='100px';const probe=document.createElement('span');probe.textContent='0'.repeat(40);probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;font-family:inherit';pg.appendChild(probe);const w=probe.getBoundingClientRect().width;probe.remove();
 const cs=getComputedStyle(scr);const aw=scr.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=scr.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 const lh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lh'))||1.3;
 BASEFS=Math.max(10,Math.min(22,Math.floor(aw/(w/100))));pg.style.fontSize=BASEFS+'px'}
let BASEFS=15;  // hele pixels: scherpere letters
addEventListener('resize',()=>{fit();draw(TT.sc||0)});

async function load(){const y=TT.sc||0;try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);D=await r.json();LOADERR=false;build()}catch(e){if(!D)LOADERR=true}draw(y)}
history.replaceState({p:TT.page,sc:0},'','#'+TT.page);
build();fit();draw();if(document.fonts)document.fonts.ready.then(()=>{fit();draw(TT.sc||0)});
load();setInterval(load,5*60*1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(tick,1000);
</script>
