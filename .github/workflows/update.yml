name: Teletekst bijwerken

on:
  # Om 5u en 13u Belgische tijd. GitHub rekent in UTC, dus er staat een tijdstip voor zomer- én wintertijd;
  # de job "tijd" laat enkel het tijdstip doorgaan dat bij de huidige Belgische tijdzone past.
  # Telkens 5 minuten vroeger gestart, zodat de gegevens rond het hele uur klaarstaan.
  schedule:
    - cron: "55 2 * * *"   # 04:55 zomertijd
    - cron: "55 3 * * *"   # 04:55 wintertijd
    - cron: "55 10 * * *"  # 12:55 zomertijd
    - cron: "55 11 * * *"  # 12:55 wintertijd
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tijd:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset=$(TZ=Europe/Brussels date +%z)
            case "${{ github.event.schedule }}" in
              "55 2 * * *"|"55 10 * * *") want="+0200" ;;
              *) want="+0100" ;;
            esac
            [ "$offset" = "$want" ] || go=false
            echo "Belgische tijdzone $offset, deze run is voor $want: go=$go"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  update:
    needs: tijd
    if: needs.tijd.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nieuws, koersen en weer ophalen
        env:
          PREV_URL: https://thibauddec.github.io/elenet-teletekst/data.json
        run: python update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
